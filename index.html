<style>
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
body {
    font-family: -apple-system, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    max-width: 700px; margin: 0 auto; padding: 20px 18px; padding-bottom: 110px;
    background: #0a0a0a; color: #f2f2f2; font-size: 16px;
    overflow-x: hidden; width: 100%;
  }
  h2 { font-weight: 800; font-size: 28px; margin-bottom: 16px; letter-spacing: -0.5px; }

  .backup-row { display: flex; gap: 8px; margin: -8px 0 16px; }
  .backup-btn { background: #161616; color: #888; border: none; padding: 6px 12px; border-radius: 10px;
                font-size: 12px; font-weight: 700; cursor: pointer; display: inline-block; }
  .backup-btn:active { background: #232323; color: #ccc; }

  .backup-reminder { background: #1c1c1c; border: 1px solid #333; border-radius: 14px; padding: 12px 14px;
                      margin: -6px 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .backup-reminder span { font-size: 13px; color: #ccc; }
  .backup-reminder-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .backup-reminder-actions button { border: none; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .backup-reminder-actions button:first-child { background: #3ddc84; color: #0a0a0a; }
  .backup-reminder-actions button:last-child { background: #232323; color: #aaa; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%);
          z-index: 100; width: calc(100% - 36px); max-width: 460px;
          background: rgba(28,28,28,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          padding: 6px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.06);
          box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
  .tab-btn { flex: 1; padding: 12px 10px; background: none; border: none; font-size: 14px; font-weight: 700;
             color: #888; cursor: pointer; border-radius: 18px; transition: 0.15s; position: relative; z-index: 1; }
  .tab-btn.active { color: #fff; transition: color 0.2s ease; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Stats top */
  .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat-box { flex: 1; min-width: 90px; background: #161616; border-radius: 18px; padding: 12px 8px; text-align: center; }
  .stat-box .label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-box .value { font-size: 18px; font-weight: 800; margin-top: 4px; color: #f2f2f2; }
  .stat-ok { color: #3ddc84 !important; }
  .stat-bad { color: #ff5c5c !important; }

  /* Graph */
  .graph-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .graph-header strong { font-size: 16px; font-weight: 800; }
  canvas { border-radius: 18px; background: #161616; width: 100%; margin-top: 4px; }

  /* Selector buttons above table */
  .select-btn-row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-start; position: relative; }
  #tab-training .select-btn-row, #tab-start .select-btn-row { background: #161616; padding: 6px; border-radius: 16px; margin-top: 0; }
  #tab-start .select-btn-row { margin-top: 14px; }
  #tab-training .select-btn, #tab-start .select-btn { flex: 1; }
  .select-btn { padding: 8px 16px; border: none; background: none; color: #aaa; border-radius: 12px; cursor: pointer;
                font-size: 13px; font-weight: 700; position: relative; z-index: 1; transition: color 0.2s ease; }
  .select-btn.active { color: #fff; }

  /* Sliding Pill Indicator (liquid-ähnlicher Tab-Wechsel) */
  .pill-indicator {
    position: absolute; top: 6px; bottom: 6px; border-radius: 18px;
    transition: left 0.42s cubic-bezier(0.34, 1.32, 0.4, 1), width 0.42s cubic-bezier(0.34, 1.32, 0.4, 1);
    z-index: 0; pointer-events: none;
  }
  .tabs .pill-indicator { background: #2f2f2f; border-radius: 18px; }
  .select-btn-row .pill-indicator { background: #2f2f2f; border-radius: 12px; }

  /* Table -> card list feel */
  table { border-collapse: collapse; width: 100%; margin-top: 14px; background: #161616; border-radius: 18px; overflow: hidden; }
  td, th { border: none; border-bottom: 1px solid #232323; padding: 10px 14px; font-size: 14px; text-align: left; color: #ddd; }
  th { color: #888; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; background: #1c1c1c; }
  tr:last-child td { border-bottom: none; }
  .month-sep-row td { background: #1c1c1c; padding: 8px 14px; border-bottom: 1px solid #232323; }
  .month-sep { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; font-weight: 700; }

  /* Swipe-to-delete für Gewicht/Arms/Chest Einträge */
  .swipe-cell { padding: 0 !important; position: relative; overflow: hidden; }
  .swipe-delete-bg { position: absolute; inset: 0; background: #ff5c5c; color: #fff; display: flex;
                      align-items: center; justify-content: flex-end; padding-right: 22px;
                      font-weight: 700; font-size: 13px; cursor: pointer; }
  .swipe-content { position: relative; z-index: 1; display: flex; justify-content: space-between;
                    align-items: center; background: #161616; padding: 10px 14px;
                    touch-action: pan-y; will-change: transform; }

  /* Training exercise table */
  .ex-table-wrap { margin-top: 14px; background: #161616; border-radius: 18px; overflow: hidden; position: relative; }
  .ex-table { width: 100%; border-collapse: collapse; margin-top: 0; }
  .ex-table th { color: #888; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
                 background: #1c1c1c; padding: 10px 8px; text-align: left; white-space: nowrap; }
  .ex-table td { padding: 10px 8px; border-bottom: 1px solid #232323; font-size: 14px; color: #ddd; white-space: nowrap; }
  .ex-table tr:last-child td { border-bottom: none; }
  .ex-table td.ex-name-cell { white-space: normal; font-weight: 700; color: #f2f2f2; }
  .ex-cell { cursor: pointer; border-radius: 8px; padding: 4px 6px; display: inline-block; min-width: 32px; }
  .ex-cell:active { background: #232323; }
  .ex-cell.empty { color: #555; }
  .ex-edit-input { width: 64px; padding: 6px 8px; background: #232323; border: 1px solid #3ddc84;
                   border-radius: 8px; color: #f2f2f2; font-size: 14px; }
  .ex-edit-input::placeholder { color: #666; opacity: 1; }
  .ex-edit-hint { font-size: 10px; color: #3ddc84; display: block; margin-top: 2px; white-space: nowrap; }
  .ex-del-btn { background: none; border: none; color: #555; font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .ex-del-btn:active { color: #ff5c5c; }
  .ex-empty-hint { padding: 20px 14px; color: #666; font-size: 14px; text-align: center; }
  .ex-table th:first-child, .ex-table td.ex-handle-cell { width: 28px; padding-left: 10px; padding-right: 0; }
  .ex-drag-handle { cursor: grab; color: #555; font-size: 18px; padding: 4px 6px; touch-action: none; user-select: none; display: inline-block; }
  .ex-table tr.dragging { opacity: 0.4; }
  .ex-table tr.ex-row-logged td { background: #1c1c1c; }
  .ex-table tr.ex-swipe-row { transition: transform 0.2s ease; touch-action: pan-y; background: #161616; }
  .ex-swipe-delete-bg { position: absolute; right: 0; background: #ff5c5c; color: #fff; display: none;
                         align-items: center; justify-content: center; font-weight: 700; font-size: 13px;
                         cursor: pointer; z-index: 2; }

  /* Floating plus button */
  .fab { position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); right: calc(24px + env(safe-area-inset-right));
         width: 58px; height: 58px; border-radius: 50%; z-index: 500;
         background: #f2f2f2; color: #0a0a0a; font-size: 30px; font-weight: 700; border: none; cursor: pointer;
         box-shadow: 0 4px 14px rgba(0,0,0,0.5);
         display: flex; align-items: center; justify-content: center; padding: 0; line-height: 1; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #161616; color: #f2f2f2; padding: 24px; border-radius: 22px; width: 90%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { font-weight: 800; margin-top: 0; }
  .modal label { display: block; margin-top: 12px; font-size: 13px; font-weight: 600; color: #aaa; }
  .modal input, .modal select {
    width: 100%; max-width: 100%; box-sizing: border-box; -webkit-appearance: none; appearance: none;
    padding: 10px; margin-top: 4px; background: #232323; border: 1px solid #333;
    border-radius: 10px; color: #f2f2f2; font-size: 14px;
  }
  .modal-actions { margin-top: 18px; display: flex; gap: 10px; }
  .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
  .modal-actions button:first-child { background: #232323; color: #ccc; }
  .modal-actions button:last-child { background: #3ddc84; color: #0a0a0a; }

  /* Skeleton Loading Screen */
  #skeletonScreen {
    position: fixed; inset: 0; z-index: 999; background: #0a0a0a;
    padding: 20px 18px; max-width: 700px; margin: 0 auto;
    transition: opacity 0.35s ease; overflow: hidden;
  }
  #skeletonScreen.fade-out { opacity: 0; pointer-events: none; }
  .sk-block {
    background: #161616; border-radius: 12px; position: relative; overflow: hidden;
  }
  .sk-block::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
    transform: translateX(-100%); animation: sk-shimmer 1.4s infinite;
  }
  @keyframes sk-shimmer { 100% { transform: translateX(100%); } }
  .sk-title { width: 160px; height: 30px; border-radius: 8px; margin-bottom: 18px; }
  .sk-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .sk-row .sk-block { flex: 1; height: 38px; }
  .sk-chart { width: 100%; height: 220px; margin-bottom: 14px; }
  .sk-tablehead { width: 100%; height: 20px; margin-bottom: 10px; }
  .sk-tablerow { width: 100%; height: 44px; margin-bottom: 8px; }
  #mainContent { opacity: 0; transition: opacity 0.35s ease; }
  #mainContent.ready { opacity: 1; }
</style>
</head>
<body>

<div id="skeletonScreen">
  <div class="sk-block sk-title"></div>
  <div class="sk-row"><div class="sk-block"></div><div class="sk-block"></div></div>
  <div class="sk-row"><div class="sk-block"></div><div class="sk-block"></div></div>
  <div class="sk-block sk-chart"></div>
  <div class="sk-row"><div class="sk-block"></div><div class="sk-block"></div><div class="sk-block"></div></div>
  <div class="sk-block sk-tablehead"></div>
  <div class="sk-block sk-tablerow"></div>
  <div class="sk-block sk-tablerow"></div>
  <div class="sk-block sk-tablerow"></div>
  <div class="sk-block sk-tablerow"></div>
  <div class="sk-block sk-tablerow"></div>
</div>

<div id="mainContent">
<h2>Fitness Log</h2>

<div class="backup-row">
  <button class="backup-btn" onclick="exportBackup()">⬇ Backup</button>
  <label class="backup-btn" for="importFile">⬆ Wiederherstellen</label>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importBackupFile(this)">
</div>

<div class="backup-reminder" id="backupReminder" style="display:none;">
  <span id="backupReminderText"></span>
  <div class="backup-reminder-actions">
    <button onclick="exportBackup()">Jetzt sichern</button>
    <button onclick="dismissBackupReminder()">Später</button>
  </div>
</div>

<div class="tabs">
  <div class="pill-indicator" id="tabsIndicator"></div>
  <button class="tab-btn active" onclick="switchTab('start')">Gewicht</button>
  <button class="tab-btn" onclick="switchTab('training')">Training</button>
</div>

<!-- START TAB -->
<div id="tab-start" class="tab-content active">
  <label style="font-size:13px; font-weight:600; color:#aaa;">Datum
    <input type="date" id="startDate" onchange="onStartDateChange()" style="display:block; width:100%; max-width:100%; box-sizing:border-box; -webkit-appearance:none; appearance:none; padding:10px; margin-top:4px; background:#161616; border:none; border-radius:12px; color:#f2f2f2; font-size:14px;">
  </label>

  <div class="stats-row" id="statsRow" style="margin-top:14px;"></div>

  <div class="graph-header">
    <strong>Verlauf</strong>
    <button id="smoothToggleBtn" onclick="toggleChartSmoothing()" style="background:#232323; color:#ccc; border:none; border-radius:10px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;">smoothed off</button>
  </div>
  <canvas id="mainChart" width="650" height="220"></canvas>

  <div class="select-btn-row" id="startModeRow">
    <div class="pill-indicator" id="startModeIndicator"></div>
    <button class="select-btn active" data-mode="gewicht" onclick="selectMode('gewicht')">Gewicht</button>
    <button class="select-btn" data-mode="oberarm" onclick="selectMode('oberarm')">Arms</button>
    <button class="select-btn" data-mode="brust" onclick="selectMode('brust')">Chest</button>
  </div>

  <table id="startTable">
    <thead><tr id="startTableHead"></tr></thead>
    <tbody id="startTableBody"></tbody>
  </table>
</div>

<!-- TRAINING TAB -->
<div id="tab-training" class="tab-content">
  <div class="select-btn-row" id="trainingCatRow">
    <div class="pill-indicator" id="trainingCatIndicator"></div>
    <button class="select-btn active" data-cat="push" onclick="selectTrainingCat('push')">Push</button>
    <button class="select-btn" data-cat="pull" onclick="selectTrainingCat('pull')">Pull</button>
    <button class="select-btn" data-cat="legs" onclick="selectTrainingCat('legs')">Legs</button>
  </div>
  <div class="ex-table-wrap">
    <div class="ex-swipe-delete-bg" id="exDeleteBg" onclick="onExDeleteBgClick()">Löschen</div>
    <table class="ex-table">
      <thead><tr><th></th><th>Übung</th><th>Sätze</th><th>Wdh</th><th>Gewicht</th></tr></thead>
      <tbody id="trainingTableBody"></tbody>
    </table>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- MODAL: Start tab entry (context-sensitive) -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <h3 id="startModalTitle">Eintragen</h3>
    <label>Datum <input type="date" id="m_datum"></label>

    <label id="m_field_label">Gewicht (kg)</label>
    <input type="number" step="0.1" id="m_value">

    <div class="modal-actions">
      <button onclick="closeModal('startModal')">Abbrechen</button>
      <button onclick="saveStartEntry()">Speichern</button>
    </div>
  </div>
</div>

<!-- MODAL: Training tab - neue Übung hinzufügen (nur Name) -->
<div class="modal-overlay" id="exerciseModal">
  <div class="modal">
    <h3>Übung hinzufügen</h3>
    <label>Name der Übung <input type="text" id="ex_new_name" placeholder="z.B. Legpress" autocomplete="off"></label>
    <div class="modal-actions">
      <button onclick="closeModal('exerciseModal')">Abbrechen</button>
      <button onclick="saveNewExercise()">Hinzufügen</button>
    </div>
  </div>
</div>

</div>

<script>
const DAILY_KEY = "fl_daily";           // gewicht, maße
const OLD_TRAINING_KEY = "fl_training"; // altes Format (Migration)
const EX_LIST_KEY = "fl_exercises";     // { id, category, name, sets, reps: [], weight: [], datum }

function loadJSON(key) { return JSON.parse(localStorage.getItem(key) || "[]"); }
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function todayStr() {
  const d = new Date();
  return d.toISOString().split("T")[0];
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function formatDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}.${m}.${y.slice(2)}`;
}

function formatWeightList(arr) {
  const unique = [...new Set(arr)];
  if (unique.length === 1) return `${unique[0]}kg`;
  return arr.map(v => `${v}kg`).join(" | ");
}

// ---------- BACKUP / WIEDERHERSTELLEN ----------
const LAST_BACKUP_KEY = "fl_last_backup";
const BACKUP_DISMISS_KEY = "fl_backup_dismissed";
const BACKUP_REMINDER_DAYS = 7;

function exportBackup() {
  const data = {
    daily: loadJSON(DAILY_KEY),
    exercises: loadJSON(EX_LIST_KEY),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `fitnesslog-backup-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  localStorage.setItem(LAST_BACKUP_KEY, todayStr());
  localStorage.removeItem(BACKUP_DISMISS_KEY);
  renderBackupReminder();
}

function dismissBackupReminder() {
  localStorage.setItem(BACKUP_DISMISS_KEY, todayStr());
  renderBackupReminder();
}

function daysSince(dateStr) {
  const then = new Date(dateStr);
  const now = new Date(todayStr());
  return Math.floor((now - then) / (1000 * 60 * 60 * 24));
}

function renderBackupReminder() {
  const box = document.getElementById("backupReminder");
  const textEl = document.getElementById("backupReminderText");
  if (!box) return;

  const lastBackup = localStorage.getItem(LAST_BACKUP_KEY);
  const dismissedAt = localStorage.getItem(BACKUP_DISMISS_KEY);

  // Heute schon weggeklickt? Dann nicht erneut anzeigen (bis morgen).
  if (dismissedAt === todayStr()) { box.style.display = "none"; return; }

  const daysSinceBackup = lastBackup ? daysSince(lastBackup) : Infinity;
  if (daysSinceBackup < BACKUP_REMINDER_DAYS) { box.style.display = "none"; return; }

  textEl.textContent = lastBackup
    ? `Letztes Backup vor ${daysSinceBackup} Tagen.`
    : "Noch kein Backup erstellt.";
  box.style.display = "flex";
}

function importBackupFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.daily) || !Array.isArray(data.exercises)) throw new Error("ungültiges Format");
      const datePart = data.exportedAt ? formatDate(data.exportedAt.slice(0, 10)) : "unbekanntem Datum";
      if (!confirm(`Aktuelle Daten mit Backup vom ${datePart} überschreiben?`)) { input.value = ""; return; }
      saveJSON(DAILY_KEY, data.daily);
      saveJSON(EX_LIST_KEY, data.exercises);
      renderAll();
      renderTrainingTable();
      alert("Backup wiederhergestellt.");
    } catch (err) {
      alert("Datei konnte nicht gelesen werden: ungültiges Backup-Format.");
    }
    input.value = "";
  };
  reader.readAsText(file);
}

// ---------- MIGRATION: altes Trainings-Format -> neue Übungsliste ----------
function migrateOldTrainingIfNeeded() {
  if (localStorage.getItem(EX_LIST_KEY)) return; // schon migriert
  const old = loadJSON(OLD_TRAINING_KEY);
  if (!old.length) { saveJSON(EX_LIST_KEY, []); return; }

  // pro Kategorie+Name nur den neuesten Eintrag übernehmen
  const map = {};
  old.sort((a, b) => a.datum.localeCompare(b.datum)).forEach(day => {
    (day.exercises || []).forEach(ex => {
      const key = day.category + "||" + ex.name;
      const sets = parseInt(ex.sets, 10) || 1;
      map[key] = {
        id: uid(),
        category: day.category,
        name: ex.name,
        sets: sets,
        reps: Array.from({ length: sets }, () => ex.reps || ""),
        weight: Array.from({ length: sets }, () => ex.weight || ""),
        datum: day.datum,
        bestWeight: null,
        bestReps: null,
        isPR: false
      };
    });
  });
  saveJSON(EX_LIST_KEY, Object.values(map));
}

let currentTab = "start";
let currentStartDate = todayStr();

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
  document.getElementById("tab-" + tab).classList.add("active");
  event.target.classList.add("active");
  movePillIndicator("tabsIndicator", event.target);
  if (tab === "training") renderTrainingTable();
}

// ---------- SLIDING PILL INDICATOR ----------
function movePillIndicator(indicatorId, activeBtn) {
  const indicator = document.getElementById(indicatorId);
  if (!indicator || !activeBtn) return;
  const container = indicator.parentElement;
  const cRect = container.getBoundingClientRect();
  const bRect = activeBtn.getBoundingClientRect();
  indicator.style.left = (bRect.left - cRect.left) + "px";
  indicator.style.width = bRect.width + "px";
}

function initPillIndicators() {
  const tabsActive = document.querySelector(".tab-btn.active");
  if (tabsActive) movePillIndicator("tabsIndicator", tabsActive);
  const modeActive = document.querySelector("#startModeRow .select-btn.active");
  if (modeActive) movePillIndicator("startModeIndicator", modeActive);
  const catActive = document.querySelector("#trainingCatRow .select-btn.active");
  if (catActive) movePillIndicator("trainingCatIndicator", catActive);
}
window.addEventListener("resize", initPillIndicators);

function onStartDateChange() {
  currentStartDate = document.getElementById("startDate").value || todayStr();
  renderStats();
}

// ---------- MODE (Weight/Arms/Chest) ----------
let currentMode = "gewicht";
const MODE_LABELS = { gewicht: "Gewicht (kg)", oberarm: "Oberarmumfang (cm)", brust: "Brustumfang (cm)" };
const MODE_FIELD = { gewicht: "gewicht", oberarm: "oberarm", brust: "brust" };

function selectMode(mode) {
  currentMode = mode;
  document.querySelectorAll("#tab-start .select-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
  movePillIndicator("startModeIndicator", document.querySelector(`#startModeRow .select-btn[data-mode="${mode}"]`));
  renderStartTable();
  renderChart();
}

// ---------- TRAINING CATEGORY (Push/Pull/Legs) ----------
function getAutoTrainingCat() {
  const day = new Date().getDay(); // 0=So, 1=Mo, 2=Di, 3=Mi, 4=Do, 5=Fr, 6=Sa
  if (day === 1 || day === 4) return "push";
  if (day === 2 || day === 5) return "pull";
  if (day === 3 || day === 6) return "legs";
  return "push"; // Sonntag: Fallback
}
let currentTrainingCat = getAutoTrainingCat();
function selectTrainingCat(cat) {
  currentTrainingCat = cat;
  editState = null;
  document.querySelectorAll("#tab-training .select-btn").forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
  movePillIndicator("trainingCatIndicator", document.querySelector(`#trainingCatRow .select-btn[data-cat="${cat}"]`));
  renderTrainingTable();
}

// ---------- MODAL HANDLING ----------
function openModal() {
  if (currentTab === "start") {
    document.getElementById("m_datum").value = currentStartDate;
    document.getElementById("m_field_label").textContent = MODE_LABELS[currentMode];
    document.getElementById("m_value").value = "";
    document.getElementById("startModal").classList.add("active");
  } else {
    document.getElementById("ex_new_name").value = "";
    document.getElementById("exerciseModal").classList.add("active");
    setTimeout(() => document.getElementById("ex_new_name").focus(), 50);
  }
}
function closeModal(id) {
  document.getElementById(id).classList.remove("active");
}

// ---------- START TAB: SAVE ----------
let _savingStartEntry = false;
function saveStartEntry() {
  if (_savingStartEntry) return; // verhindert Doppel-Ausführung bei schnellem Doppel-Tap
  _savingStartEntry = true;
  setTimeout(() => { _savingStartEntry = false; }, 500);

  const datum = (document.getElementById("m_datum").value || "").trim();
  if (!datum) { _savingStartEntry = false; alert("Bitte Datum wählen."); return; }

  const fieldName = MODE_FIELD[currentMode];
  const entry = {
    datum,
    [fieldName]: document.getElementById("m_value").value || null
  };

  let entries = loadJSON(DAILY_KEY);
  const idx = entries.findIndex(e => e.datum === datum);
  if (idx >= 0) entries[idx] = { ...entries[idx], ...entry };
  else entries.push(entry);
  entries.sort((a, b) => a.datum.localeCompare(b.datum));
  saveJSON(DAILY_KEY, entries);

  closeModal("startModal");
  renderAll();
}

// ---------- TRAINING TAB: Übungen verwalten ----------
function saveNewExercise() {
  const name = document.getElementById("ex_new_name").value.trim();
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const list = loadJSON(EX_LIST_KEY);
  list.push({ id: uid(), category: currentTrainingCat, name, sets: null, reps: [], weight: [], datum: null,
              bestWeight: null, bestReps: null, isPR: false });
  saveJSON(EX_LIST_KEY, list);
  closeModal("exerciseModal");
  renderTrainingTable();
}

function deleteExercise(id) {
  const list = loadJSON(EX_LIST_KEY);
  const ex = list.find(e => e.id === id);
  if (ex && !confirm(`"${ex.name}" löschen?`)) return;
  saveJSON(EX_LIST_KEY, list.filter(e => e.id !== id));
  if (editState && editState.id === id) editState = null;
  renderTrainingTable();
}

// ---------- SWIPE TO DELETE (Übungen im Training) ----------
let exSwipeState = { startX: 0, startY: 0, dragging: false, tr: null, locked: null, currentX: 0 };
const EX_SWIPE_MAX = 84;

function closeAllExSwipes(except) {
  document.querySelectorAll(".ex-table tr.ex-swiped").forEach(tr => {
    if (tr !== except) { tr.style.transform = "translateX(0)"; tr.classList.remove("ex-swiped"); }
  });
  if (!except) hideExDeleteBg();
}

function positionExDeleteBg(tr) {
  const bg = document.getElementById("exDeleteBg");
  const wrap = tr.closest(".ex-table-wrap");
  if (!bg || !wrap) return;
  const wrapRect = wrap.getBoundingClientRect();
  const trRect = tr.getBoundingClientRect();
  bg.style.display = "flex";
  bg.style.top = (trRect.top - wrapRect.top) + "px";
  bg.style.height = trRect.height + "px";
  bg.style.width = EX_SWIPE_MAX + "px";
  bg.dataset.exId = tr.dataset.id;
}

function hideExDeleteBg() {
  const bg = document.getElementById("exDeleteBg");
  if (bg) bg.style.display = "none";
}

function onExDeleteBgClick() {
  const bg = document.getElementById("exDeleteBg");
  if (bg && bg.dataset.exId) deleteExercise(bg.dataset.exId);
}

function exSwipeStart(e) {
  if (e.target.closest(".ex-drag-handle") || e.target.closest(".ex-cell") || e.target.closest("input")) return;
  const t = e.touches[0];
  exSwipeState = { startX: t.clientX, startY: t.clientY, dragging: false, tr: e.currentTarget, locked: null, currentX: 0 };
}

function exSwipeMove(e) {
  if (!exSwipeState.tr) return;
  const t = e.touches[0];
  const dx = t.clientX - exSwipeState.startX;
  const dy = t.clientY - exSwipeState.startY;
  if (exSwipeState.locked === null) {
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) exSwipeState.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  }
  if (exSwipeState.locked !== "x") return;
  e.preventDefault();
  exSwipeState.dragging = true;
  const base = exSwipeState.tr.classList.contains("ex-swiped") ? -EX_SWIPE_MAX : 0;
  const nx = Math.max(-EX_SWIPE_MAX, Math.min(0, base + dx));
  exSwipeState.tr.style.transition = "none";
  exSwipeState.tr.style.transform = `translateX(${nx}px)`;
  exSwipeState.currentX = nx;
  positionExDeleteBg(exSwipeState.tr);
}

function exSwipeEnd() {
  if (!exSwipeState.tr) return;
  const tr = exSwipeState.tr;
  tr.style.transition = "transform 0.2s ease";
  if (exSwipeState.dragging) {
    if (exSwipeState.currentX < -EX_SWIPE_MAX / 2) {
      tr.style.transform = `translateX(-${EX_SWIPE_MAX}px)`;
      tr.classList.add("ex-swiped");
      closeAllExSwipes(tr);
      positionExDeleteBg(tr);
    } else {
      tr.style.transform = "translateX(0)";
      tr.classList.remove("ex-swiped");
      hideExDeleteBg();
    }
  } else if (tr.classList.contains("ex-swiped")) {
    tr.style.transform = "translateX(0)";
    tr.classList.remove("ex-swiped");
    hideExDeleteBg();
  }
  exSwipeState = { startX: 0, startY: 0, dragging: false, tr: null, locked: null, currentX: 0 };
}

// ---------- TRAINING TAB: Klick-zum-Bearbeiten mit Enter-Sprung ----------
// editState.stage: 'sets' | 'reps' | 'weight'
let editState = null;

function beginEdit(id, stage) {
  const list = loadJSON(EX_LIST_KEY);
  const ex = list.find(e => e.id === id);
  if (!ex) return;

  if (stage === "sets" || !ex.sets) {
    editState = { id, stage: "sets", index: 0, sets: null, tempReps: [], tempWeight: [],
                  prevSets: ex.sets || null, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  } else if (stage === "reps") {
    editState = { id, stage: "reps", index: 0, sets: ex.sets, tempReps: [], tempWeight: [],
                  prevSets: ex.sets, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  } else if (stage === "weight") {
    editState = { id, stage: "weight", index: 0, sets: ex.sets, tempReps: ex.reps.slice(), tempWeight: [],
                  prevSets: ex.sets, prevReps: ex.reps || [], prevWeight: ex.weight || [] };
  }
  renderTrainingTable();
}

function handleEditKey(e) {
  if (e.key === "Escape") { editState = null; renderTrainingTable(); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  commitEditStep(e.target.value);
}

function commitEditStep(rawVal) {
  const list = loadJSON(EX_LIST_KEY);
  const idx = list.findIndex(e => e.id === editState.id);
  if (idx < 0) { editState = null; renderTrainingTable(); return; }

  if (editState.stage === "sets") {
    let n = parseInt(rawVal, 10);
    if (!n && editState.prevSets) n = editState.prevSets;
    if (!n || n < 1) { editState = null; renderTrainingTable(); return; }
    editState.sets = n;
    editState.stage = "reps";
    editState.index = 0;
    renderTrainingTable();
    return;
  }

  if (editState.stage === "reps") {
    let val = rawVal;
    if (val === "" && editState.prevReps[editState.index] !== undefined) val = editState.prevReps[editState.index];
    editState.tempReps[editState.index] = val;
    editState.index++;
    if (editState.index < editState.sets) { renderTrainingTable(); return; }
    editState.stage = "weight";
    editState.index = 0;
    renderTrainingTable();
    return;
  }

  if (editState.stage === "weight") {
    let val = rawVal;
    if (val === "" && editState.prevWeight[editState.index] !== undefined) val = editState.prevWeight[editState.index];
    editState.tempWeight[editState.index] = val;
    editState.index++;
    if (editState.index < editState.sets) { renderTrainingTable(); return; }
    // fertig -> speichern
    const maxW = Math.max(...editState.tempWeight.map(Number).filter(n => !isNaN(n)));
    const maxR = Math.max(...editState.tempReps.map(Number).filter(n => !isNaN(n)));
    const prevBestW = list[idx].bestWeight;
    const prevBestR = list[idx].bestReps;
    const isNewPR = (prevBestW != null && maxW > prevBestW);

    list[idx].sets = editState.sets;
    list[idx].reps = editState.tempReps;
    list[idx].weight = editState.tempWeight;
    list[idx].datum = todayStr();
    list[idx].bestWeight = Math.max(prevBestW || 0, isFinite(maxW) ? maxW : 0);
    list[idx].bestReps = Math.max(prevBestR || 0, isFinite(maxR) ? maxR : 0);
    list[idx].isPR = isNewPR;
    saveJSON(EX_LIST_KEY, list);
    editState = null;
    renderTrainingTable();
    return;
  }
}

// ---------- TRAINING TAB: Reihenfolge per Drag & Drop ----------
let dragId = null;

function onDragHandleDown(e, id) {
  e.preventDefault();
  dragId = id;
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragUp);
  renderTrainingTable();
}

function onDragMove(e) {
  if (!dragId) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const row = el && el.closest("tr[data-id]");
  if (!row) return;
  const targetId = row.dataset.id;
  if (targetId === dragId) return;

  const list = loadJSON(EX_LIST_KEY);
  const catList = list.filter(x => x.category === currentTrainingCat);
  const others = list.filter(x => x.category !== currentTrainingCat);
  const fromIdx = catList.findIndex(x => x.id === dragId);
  const toIdx = catList.findIndex(x => x.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;

  const [moved] = catList.splice(fromIdx, 1);
  catList.splice(toIdx, 0, moved);
  saveJSON(EX_LIST_KEY, others.concat(catList));
  renderTrainingTable();
}

function onDragUp() {
  dragId = null;
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragUp);
  renderTrainingTable();
}

// ---------- RENDER: STATS ----------
function renderStats() {
  const entries = loadJSON(DAILY_KEY);
  const last = entries[entries.length - 1] || {};

  const gewichtEntries = entries.filter(e => e.gewicht);
  let gewichtDiffHTML = "";
  if (gewichtEntries.length >= 2) {
    const diff = parseFloat(gewichtEntries[gewichtEntries.length - 1].gewicht) - parseFloat(gewichtEntries[gewichtEntries.length - 2].gewicht);
    const sign = diff > 0 ? "+" : "";
    gewichtDiffHTML = ` <span style="font-size:12px; font-weight:600; color:#888;">(${sign}${diff.toFixed(1)})</span>`;
  }

  const box = (label, value) => `
    <div class="stat-box">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
    </div>`;
  document.getElementById("statsRow").innerHTML =
    box("Gewicht", last.gewicht ? last.gewicht + " kg" + gewichtDiffHTML : "-") +
    box("Oberarm", last.oberarm ? last.oberarm + " cm" : "-") +
    box("Brust", last.brust ? last.brust + " cm" : "-");
}

// ---------- RENDER: TABLE (Start tab, filtered by graph selection) ----------
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function monthLabel(monthKey) {
  const [y, m] = monthKey.split("-");
  return `${MONTH_NAMES[parseInt(m, 10) - 1]} ${y.slice(2)}`;
}

// ---------- SWIPE TO DELETE (Gewicht/Arms/Chest) ----------
let swipeState = { startX: 0, startY: 0, dragging: false, el: null, locked: null, currentX: 0 };
const SWIPE_MAX = 84;

function closeAllSwipes(except) {
  document.querySelectorAll(".swipe-content.swiped").forEach(el => {
    if (el !== except) { el.style.transform = "translateX(0)"; el.classList.remove("swiped"); }
  });
}

function onSwipeStart(e) {
  const t = e.touches[0];
  swipeState = { startX: t.clientX, startY: t.clientY, dragging: false, el: e.currentTarget, locked: null, currentX: 0 };
}

function onSwipeMove(e) {
  if (!swipeState.el) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeState.startX;
  const dy = t.clientY - swipeState.startY;
  if (swipeState.locked === null) {
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) swipeState.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  }
  if (swipeState.locked !== "x") return;
  e.preventDefault();
  swipeState.dragging = true;
  const base = swipeState.el.classList.contains("swiped") ? -SWIPE_MAX : 0;
  let nx = Math.max(-SWIPE_MAX, Math.min(0, base + dx));
  swipeState.el.style.transition = "none";
  swipeState.el.style.transform = `translateX(${nx}px)`;
  swipeState.currentX = nx;
}

function onSwipeEnd() {
  if (!swipeState.el) return;
  const el = swipeState.el;
  el.style.transition = "transform 0.2s ease";
  if (swipeState.dragging) {
    if (swipeState.currentX < -SWIPE_MAX / 2) {
      el.style.transform = `translateX(-${SWIPE_MAX}px)`;
      el.classList.add("swiped");
      closeAllSwipes(el);
    } else {
      el.style.transform = "translateX(0)";
      el.classList.remove("swiped");
    }
  } else if (el.classList.contains("swiped")) {
    el.style.transform = "translateX(0)";
    el.classList.remove("swiped");
  }
  swipeState = { startX: 0, startY: 0, dragging: false, el: null, locked: null, currentX: 0 };
}

function deleteDailyValue(datum, mode) {
  let entries = loadJSON(DAILY_KEY);
  const idx = entries.findIndex(e => e.datum === datum);
  if (idx === -1) return;
  delete entries[idx][mode];
  const e = entries[idx];
  if (!e.gewicht && !e.oberarm && !e.brust) entries.splice(idx, 1);
  saveJSON(DAILY_KEY, entries);
  renderAll();
}

function buildTableRowsWithMonthAverages(entries, valueKey, unit) {
  // entries: bereits absteigend nach Datum sortiert (neueste zuerst)
  const monthSums = {};
  entries.forEach(e => {
    const mKey = e.datum.slice(0, 7);
    const v = parseFloat(e[valueKey]);
    if (isNaN(v)) return;
    if (!monthSums[mKey]) monthSums[mKey] = { sum: 0, count: 0 };
    monthSums[mKey].sum += v;
    monthSums[mKey].count++;
  });
  const monthKeysAsc = Object.keys(monthSums).sort();
  const avgFor = k => monthSums[k].sum / monthSums[k].count;

  const sepRow = (monthKey) => {
    const idx = monthKeysAsc.indexOf(monthKey);
    const olderKey = monthKeysAsc[idx - 1];
    const avg = avgFor(monthKey);
    let diffHTML = "";
    if (olderKey) {
      const diff = avg - avgFor(olderKey);
      const color = diff > 0 ? "#3ddc84" : (diff < 0 ? "#ff5c5c" : "#888");
      const sign = diff > 0 ? "+" : "";
      diffHTML = `<span style="color:${color}; font-weight:700;">${sign}${diff.toFixed(1)} ${unit}</span>`;
    }
    return `<tr class="month-sep-row"><td colspan="2">
      <div class="month-sep"><span>Ø ${monthLabel(monthKey)}: ${avg.toFixed(1)} ${unit}</span>${diffHTML}</div>
    </td></tr>`;
  };

  let html = "";
  let lastMonth = null;
  entries.forEach(e => {
    const mKey = e.datum.slice(0, 7);
    if (lastMonth !== null && mKey !== lastMonth) html += sepRow(lastMonth);
    const v = e[valueKey];
    html += `<tr class="swipe-row">
      <td colspan="2" class="swipe-cell">
        <div class="swipe-delete-bg" onclick="deleteDailyValue('${e.datum}','${valueKey}')">Löschen</div>
        <div class="swipe-content" ontouchstart="onSwipeStart(event)" ontouchmove="onSwipeMove(event)" ontouchend="onSwipeEnd(event)">
          <span>${formatDate(e.datum)}</span><span>${v} ${unit}</span>
        </div>
      </td>
    </tr>`;
    lastMonth = mKey;
  });
  return html;
}

function renderStartTable() {
  const mode = currentMode;
  const head = document.getElementById("startTableHead");
  const body = document.getElementById("startTableBody");

  if (mode === "gewicht") {
    head.innerHTML = "<th>Datum</th><th>Gewicht</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.gewicht).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = buildTableRowsWithMonthAverages(entries, "gewicht", "kg");
  } else if (mode === "oberarm") {
    head.innerHTML = "<th>Datum</th><th>Oberarm</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.oberarm).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = buildTableRowsWithMonthAverages(entries, "oberarm", "cm");
  } else if (mode === "brust") {
    head.innerHTML = "<th>Datum</th><th>Brust</th>";
    const entries = loadJSON(DAILY_KEY).filter(e => e.brust).sort((a, b) => b.datum.localeCompare(a.datum));
    body.innerHTML = buildTableRowsWithMonthAverages(entries, "brust", "cm");
  }
}

// ---------- RENDER: TRAINING TABLE ----------
function renderTrainingTable() {
  const body = document.getElementById("trainingTableBody");
  const list = loadJSON(EX_LIST_KEY).filter(e => e.category === currentTrainingCat);

  if (!list.length) {
    body.innerHTML = `<tr><td colspan="5" class="ex-empty-hint">Noch keine Übungen. Mit + eine hinzufügen.</td></tr>`;
    return;
  }

  const editing = editState;

  body.innerHTML = list.map(ex => {
    const isEditingRow = editing && editing.id === ex.id;

    // ---- Sätze-Zelle ----
    let setsCell;
    if (isEditingRow && editing.stage === "sets") {
      setsCell = `<input class="ex-edit-input" id="editInput" type="text" inputmode="text" placeholder="${editing.prevSets || 'Sätze'}"
                    onkeydown="handleEditKey(event)">`;
    } else {
      setsCell = ex.sets
        ? `<span class="ex-cell" onclick="beginEdit('${ex.id}','sets')">${ex.sets}</span>`
        : `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','sets')">-</span>`;
    }

    // ---- Wdh-Zelle ----
    let repsCell;
    if (isEditingRow && editing.stage === "reps") {
      repsCell = `<input class="ex-edit-input" id="editInput" type="text" inputmode="text"
                    placeholder="${editing.prevReps[editing.index] !== undefined ? editing.prevReps[editing.index] : 'Satz ' + (editing.index + 1)}" onkeydown="handleEditKey(event)">
                  <span class="ex-edit-hint">Satz ${editing.index + 1} von ${editing.sets}</span>`;
    } else if (ex.reps && ex.reps.length) {
      repsCell = `<span class="ex-cell" onclick="beginEdit('${ex.id}','reps')">${ex.reps.join(" | ")}</span>`;
    } else {
      repsCell = `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','reps')">-</span>`;
    }

    // ---- Gewicht-Zelle ----
    let weightCell;
    if (isEditingRow && editing.stage === "weight") {
      weightCell = `<input class="ex-edit-input" id="editInput" type="text" inputmode="text"
                     placeholder="${editing.prevWeight[editing.index] !== undefined ? editing.prevWeight[editing.index] : 'Satz ' + (editing.index + 1)}" onkeydown="handleEditKey(event)">
                    <span class="ex-edit-hint">Satz ${editing.index + 1} von ${editing.sets}</span>`;
    } else if (ex.weight && ex.weight.length) {
      weightCell = `<span class="ex-cell" onclick="beginEdit('${ex.id}','weight')">${formatWeightList(ex.weight)}</span>`;
    } else {
      weightCell = `<span class="ex-cell empty" onclick="beginEdit('${ex.id}','weight')">-</span>`;
    }

    // ---- Progressive-Overload-Markierung: alle Sätze >= 12 Wdh -> Gewicht sollte erhöht werden ----
    let repsHasHighRep = false;
    let allSetsHighRep = false;
    if (!isEditingRow && ex.reps && ex.reps.length) {
      repsHasHighRep = ex.reps.some(r => parseInt(r, 10) >= 12);
      allSetsHighRep = ex.reps.every(r => parseInt(r, 10) >= 12);
    }
    const overloadStyle = ' style="color:#999;"';

    let repsStyle = '';
    if (allSetsHighRep) repsStyle = ' style="text-decoration: underline; text-decoration-color: #999; text-decoration-thickness: 2px; color:#999;"';
    else if (repsHasHighRep) repsStyle = ' style="text-decoration: underline; text-decoration-color: #999; text-decoration-thickness: 2px;"';

    const isDragging = dragId === ex.id;
    const isLoggedToday = ex.datum === todayStr();

    return `<tr data-id="${ex.id}" class="ex-swipe-row ${isDragging ? 'dragging' : ''}${isLoggedToday ? ' ex-row-logged' : ''}"
                ontouchstart="exSwipeStart(event)" ontouchmove="exSwipeMove(event)" ontouchend="exSwipeEnd(event)">
      <td class="ex-handle-cell"><span class="ex-drag-handle" onpointerdown="onDragHandleDown(event,'${ex.id}')">${ex.isPR ? '🏆' : '⠿'}</span></td>
      <td class="ex-name-cell"${allSetsHighRep ? overloadStyle : ''}>${ex.name}</td>
      <td>${setsCell}</td>
      <td${repsStyle}>${repsCell}</td>
      <td${allSetsHighRep ? overloadStyle : ''}>${weightCell}</td>
    </tr>`;
  }).join("");

  const activeInput = document.getElementById("editInput");
  if (activeInput) activeInput.focus();
}

// ---------- CHART ----------
const CHART_BASE_HEIGHT = 220; // feste Basishöhe, NICHT aus canvas.height lesen (das wächst sonst exponentiell)
const CHART_SMOOTH_KEY = "fl_chart_smooth";

function toggleChartSmoothing() {
  const on = localStorage.getItem(CHART_SMOOTH_KEY) === "1";
  localStorage.setItem(CHART_SMOOTH_KEY, on ? "0" : "1");
  renderChart();
}

function updateSmoothToggleBtn() {
  const btn = document.getElementById("smoothToggleBtn");
  if (!btn) return;
  const on = localStorage.getItem(CHART_SMOOTH_KEY) === "1";
  btn.textContent = on ? "smoothed on" : "smoothed off";
  btn.style.background = on ? "#3ddc84" : "#232323";
  btn.style.color = on ? "#0a0a0a" : "#ccc";
}

function renderChart() {
  updateSmoothToggleBtn();
  const canvas = document.getElementById("mainChart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth;
  const cssHeight = CHART_BASE_HEIGHT;
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const mode = currentMode;
  const daily = loadJSON(DAILY_KEY);

  let points = [];
  if (mode === "gewicht") points = daily.filter(e => e.gewicht).map(e => ({ datum: e.datum, val: parseFloat(e.gewicht) }));
  else if (mode === "oberarm") points = daily.filter(e => e.oberarm).map(e => ({ datum: e.datum, val: parseFloat(e.oberarm) }));
  else if (mode === "brust") points = daily.filter(e => e.brust).map(e => ({ datum: e.datum, val: parseFloat(e.brust) }));

  const padding = 38; // Platz links/rechts (u.a. für Achsen-Zahlen)
  const bottomPad = 22; // nur so viel Platz unten wie für die Achsen-Beschriftung nötig
  const chartH = cssHeight - bottomPad;
  const w = cssWidth - padding * 2;

  // Build a date -> x mapping based on actual elapsed time, not index position
  // WICHTIG: nur die Daten der Punkte verwenden, die für den aktuellen Modus existieren –
  // sonst spannt sich die Achse über alle jemals erfassten Einträge (z.B. reine Gewichts-Logs).
  const allDates = points.map(p => p.datum);
  let xForDate = () => padding;
  if (allDates.length > 0) {
    const times = allDates.map(d => new Date(d).getTime());
    const minT = Math.min(...times);
    const maxT = Math.max(...times);
    const span = maxT - minT || 1;
    xForDate = (datum) => padding + ((new Date(datum).getTime() - minT) / span) * w;
  }

  if (points.length < 2) {
    ctx.fillStyle = "#888";
    ctx.fillText("Mindestens 2 Einträge nötig für Diagramm.", 10, 100);
  } else {
    const vals = points.map(p => p.val);
    const min = Math.min(...vals) - 1;
    const max = Math.max(...vals) + 1;

    ctx.beginPath();
    ctx.strokeStyle = "#333333";
    ctx.moveTo(padding, 10);
    ctx.lineTo(padding, chartH);
    ctx.lineTo(cssWidth - padding, chartH);
    ctx.stroke();

    ctx.beginPath();
    ctx.strokeStyle = "#3ddc84";
    ctx.lineWidth = 2;
    const smoothOn = localStorage.getItem(CHART_SMOOTH_KEY) === "1";
    const coords = points.map(p => ({ x: xForDate(p.datum), y: chartH - ((p.val - min) / (max - min)) * (chartH - 20) }));

    if (!smoothOn || coords.length < 3) {
      coords.forEach((c, i) => { if (i === 0) ctx.moveTo(c.x, c.y); else ctx.lineTo(c.x, c.y); });
    } else {
      // Starke, weiche Glättung über Zwischenpunkte (Midpoint-Bezier).
      // Die eigentlichen Datenpunkte/Werte bleiben unverändert, nur die gezeichnete Linie wird geglättet.
      ctx.moveTo(coords[0].x, coords[0].y);
      for (let i = 1; i < coords.length - 1; i++) {
        const midX = (coords[i].x + coords[i + 1].x) / 2;
        const midY = (coords[i].y + coords[i + 1].y) / 2;
        ctx.quadraticCurveTo(coords[i].x, coords[i].y, midX, midY);
      }
      const last = coords.length - 1;
      ctx.quadraticCurveTo(coords[last - 1].x, coords[last - 1].y, coords[last].x, coords[last].y);
    }
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = "#888888";
    ctx.font = "12px -apple-system, sans-serif";
    ctx.fillText(max.toFixed(1), 6, 15);
    ctx.fillText(min.toFixed(1), 6, chartH);
  }
}

function renderAll() {
  renderStats();
  renderStartTable();
  renderChart();
}
